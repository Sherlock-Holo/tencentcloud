[package]
name = "tencentcloud"
version = "0.3.0"
edition = "2024"
authors = ["Sherlock Holo <sherlockya@gmail.com>"]
license = "MIT"
repository = "https://github.com/Sherlock-Holo/tencentcloud"
description = "tencentcloud rust generic sdk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tokio-rustls-tls"]

tokio-rustls-tls = ["dep:hyper-rustls"]
tokio-native-tls = ["dep:tokio-native-tls", "tokio/net", "dep:native-tls", "dep:tower-service"]

async-net-rustls-tls = [
    "dep:async-global-executor",
    "dep:async-net",
    "dep:futures-rustls",
    "dep:rustls-native-certs",
    "dep:tower-service",
    "futures-util/io"
]

async-net-native-tls = [
    "dep:async-global-executor",
    "dep:async-net",
    "dep:async-native-tls",
    "dep:tower-service",
    "futures-util/io"
]

[dependencies]
bytes = "1.11.1"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
hyper = "1.9.0"
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2"] }
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
futures-util = "0.3.32"

# async rustls or native-tls
async-global-executor = { version = "3.1.0", optional = true }
async-net = { version = "2.0.0", optional = true }
futures-rustls = { version = "0.26.0", default-features = false, features = ["logging", "ring", "tls12"], optional = true }
rustls-native-certs = { version = "0.8.3", optional = true }
async-native-tls = { version = "0.6.0", optional = true }

# tokio rustls or native-tls
hyper-rustls = { version = "0.27.7", default-features = false, features = [
    "http1",
    "http2",
    "native-tokio",
    "ring",
    "tls12",
    "rustls-native-certs"
], optional = true }

tokio = { version = "1", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
tower-service = { version = "0.3.3", optional = true }
# make sure we can set alpn
native-tls = { version = "0.2", features = ["alpn"], optional = true }
